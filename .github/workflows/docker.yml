name: Docker

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - docker-compose.yml
      - "**/Dockerfile"
      - "**/.dockerignore"
      - .github/workflows/docker.yml
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - docker-compose.yml
      - "**/Dockerfile"
      - "**/.dockerignore"
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  docker-smoke:
    name: Build and smoke-test images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and start stack
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          docker compose build \
            --build-arg BUILDKIT_INLINE_CACHE=1
          docker compose up -d --wait

      - name: Smoke test backend health
        run: |
          curl -fsS http://localhost:8000/health | tee /tmp/health.json
          python -c "import json; d=json.load(open('/tmp/health.json')); assert d.get('status')=='ok', d"

      - name: Smoke test frontend
        run: curl -fsS -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q 200

      - name: Smoke test analyze endpoint
        run: |
          python - <<'PY'
          import base64
          import json
          import urllib.request

          png_b64 = (
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
          )
          with open("/tmp/smoke.png", "wb") as f:
              f.write(base64.b64decode(png_b64))
          PY
          curl -fsS -X POST -F "file=@/tmp/smoke.png;type=image/png" \
            http://localhost:8000/analyze | tee /tmp/analyze.json
          python -c "import json; d=json.load(open('/tmp/analyze.json')); assert 'quality_score' in d, d"

      - name: Tear down
        if: always()
        run: docker compose down -v
